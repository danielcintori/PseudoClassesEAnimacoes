<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prática de pseudo-classes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Pseudo-Classes CSS</h1>

    <h2>Interações</h2>
    <a href="https://www.r7.com/">Passe o mouse ou clique neste link</a>
    <button>Clique e segure</button>

    <h2>Formulário</h2>
    <form>
      <label for="nome">Nome obrigatório:</label>
      <input type="text" id="nome" required />

      <label for="email">E-mail:</label>
      <input type="email" id="email" />

      <label for="checkbox">
        <input type="checkbox" name="" id="" />
      </label>
    </form>

    <h2>Lista</h2>
    <ul>
      <li>Primeiro item</li>
      <li>Segundo item</li>
      <li>Terceiro item</li>
      <li>Quarto item</li>
    </ul>

    <div class="caixa">Estou animado</div>

    <div class="palco">
      <div class="bola"></div>
    </div>

    <section class="sistema">
      <div class="sol"></div>

      <div class="orbita">
        <div class="planeta"></div>
      </div>
    </section>
  </body>
</html>
